<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Supper">
<meta name="theme-color" content="#f6f7f5" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0f1311" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<title>Supper</title>
<style>
:root{
  --bg:#f6f7f5;--card:#ffffff;--ink:#1c2420;--muted:#6b746f;--line:#e5e8e5;
  --accent:#1e9e5d;--accent-ink:#ffffff;--accent-soft:#e2f4e9;--danger:#d14a3c;
  --shadow:0 1px 2px rgba(20,30,25,.06),0 6px 18px rgba(20,30,25,.06);
  --tab-h:58px;--r:16px;
  --safe-t:env(safe-area-inset-top,0px);--safe-b:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root{--bg:#0f1311;--card:#181e1b;--ink:#ecf1ee;--muted:#98a29c;--line:#28302c;
    --accent:#35c37b;--accent-ink:#06210f;--accent-soft:#163525;--danger:#ef6b5c;
    --shadow:0 1px 2px rgba(0,0,0,.4);}
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink)}
body{font:16px/1.4 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,system-ui,sans-serif;
  -webkit-font-smoothing:antialiased;overscroll-behavior-y:none}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
input,textarea,select{font:inherit;font-size:16px;color:var(--ink)}
h1,h2,h3,p{margin:0}
.hidden{display:none!important}

/* ---------- layout ---------- */
#main{min-height:100vh;padding:calc(var(--safe-t) + 8px) 16px calc(var(--tab-h) + var(--safe-b) + 24px)}
.hd{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;padding:14px 2px 14px}
.hd h1{font-size:32px;letter-spacing:-.02em;line-height:1.1}
.hd .sub{color:var(--muted);font-size:15px;margin-top:4px}
.icon-btn{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:var(--card);box-shadow:var(--shadow);flex:none}
.icon-btn svg{width:20px;height:20px}
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;padding-bottom:var(--safe-b);
  background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:saturate(1.6) blur(18px);-webkit-backdrop-filter:saturate(1.6) blur(18px);
  border-top:1px solid var(--line)}
.tabbar button{flex:1;height:var(--tab-h);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11px;font-weight:600;color:var(--muted);position:relative}
.tabbar button svg{width:24px;height:24px}
.tabbar button.on{color:var(--accent)}
.badge{position:absolute;top:6px;left:calc(50% + 6px);min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--accent);color:var(--accent-ink);font-size:11px;line-height:18px;text-align:center}

/* ---------- generic ---------- */
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);padding:16px;margin-bottom:14px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:50px;padding:0 20px;border-radius:14px;font-weight:650;font-size:16px;width:100%}
.btn.primary{background:var(--accent);color:var(--accent-ink)}
.btn.secondary{background:var(--accent-soft);color:var(--accent)}
.btn.ghost{background:var(--card);box-shadow:var(--shadow)}
.btn.danger{color:var(--danger);background:var(--card);box-shadow:var(--shadow)}
.btn:active,.icon-btn:active,.rcard:active,.plan-card:active{transform:scale(.98)}
.row{display:flex;align-items:center;gap:12px}
.sp{flex:1}
.muted{color:var(--muted)}
.small{font-size:13px}
.section-t{font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:22px 4px 8px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 10px;margin:0 -16px;padding-left:18px;padding-right:18px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;height:34px;padding:0 14px;border-radius:17px;background:var(--card);box-shadow:var(--shadow);font-size:14px;font-weight:600;white-space:nowrap}
.chip.on{background:var(--ink);color:var(--bg)}
.chipwrap{display:flex;flex-wrap:wrap;gap:8px}
.chipwrap .chip{box-shadow:none;border:1.5px solid var(--line);background:transparent}
.chipwrap .chip.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.stepper{display:inline-flex;align-items:center;background:var(--bg);border-radius:12px;height:36px}
.stepper button{width:36px;height:36px;font-size:20px;font-weight:600;color:var(--accent)}
.stepper span{min-width:64px;text-align:center;font-weight:650;font-size:14px}
.tile{display:grid;place-items:center;border-radius:12px;background:color-mix(in srgb,var(--c) 30%,var(--card));flex:none}
.empty{text-align:center;padding:36px 20px 24px}
.empty .big{font-size:64px;line-height:1;margin-bottom:12px}
.empty h2{font-size:21px;margin-bottom:6px}
.empty p{color:var(--muted);margin-bottom:20px}
.stack>*+*{margin-top:10px}
.field{display:block;margin-bottom:14px}
.field>span{display:block;font-size:13px;font-weight:650;color:var(--muted);margin:0 2px 6px}
.input,textarea.input,select.input{width:100%;border:1.5px solid var(--line);background:var(--card);border-radius:12px;padding:12px 14px;outline:none}
.input:focus{border-color:var(--accent)}
textarea.input{min-height:150px;resize:vertical;line-height:1.5}
.toast{position:fixed;left:50%;bottom:calc(var(--tab-h) + var(--safe-b) + 16px);transform:translate(-50%,20px);opacity:0;z-index:200;
  background:var(--ink);color:var(--bg);padding:11px 18px;border-radius:24px;font-size:14px;font-weight:600;transition:.25s;pointer-events:none;max-width:90vw;text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0)}

/* ---------- plan ---------- */
.plan-card{display:flex;gap:12px;align-items:center;background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);padding:10px;margin-bottom:10px}
.plan-card .tile{width:72px;height:72px;font-size:38px}
.plan-card .info{flex:1;min-width:0}
.plan-card .t{font-weight:650;line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.plan-card .m{color:var(--muted);font-size:13px;margin:3px 0 6px}
.plan-card.cooked .t{text-decoration:line-through;color:var(--muted)}
.plan-card.cooked .tile{filter:grayscale(.8);opacity:.6}
.check{width:30px;height:30px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;flex:none;color:transparent}
.check.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.check svg{width:16px;height:16px}
.plan-sum{display:flex;gap:10px;margin-bottom:14px}
.plan-sum div{flex:1;background:var(--card);border-radius:14px;box-shadow:var(--shadow);padding:12px}
.plan-sum b{display:block;font-size:22px}
.plan-sum span{font-size:12px;color:var(--muted);font-weight:600}

/* ---------- recipes ---------- */
.search{position:relative;margin-bottom:12px}
.search input{width:100%;height:44px;border-radius:12px;border:0;background:var(--card);box-shadow:var(--shadow);padding:0 14px 0 40px;outline:none}
.search svg{position:absolute;left:12px;top:12px;width:20px;height:20px;color:var(--muted)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.rcard{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden;text-align:left;display:flex;flex-direction:column}
.rcard .tile{border-radius:0;height:118px;font-size:56px;position:relative}
.rcard .body{padding:10px 12px 12px;flex:1;display:flex;flex-direction:column}
.rcard .t{font-weight:650;font-size:15px;line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;flex:1}
.rcard .m{color:var(--muted);font-size:12px;margin-top:6px}
.add-fab{position:absolute;top:8px;right:8px;width:34px;height:34px;border-radius:50%;background:var(--card);color:var(--accent);display:grid;place-items:center;box-shadow:0 2px 8px rgba(0,0,0,.15)}
.add-fab.on{background:var(--accent);color:var(--accent-ink)}
.add-fab svg{width:18px;height:18px}
.fav-dot{position:absolute;top:10px;left:10px;font-size:16px}
.hint{text-align:center;color:var(--muted);font-size:14px;margin:18px 0 0}
.link{color:var(--accent);font-weight:650}

/* ---------- grocery ---------- */
.add-item{display:flex;gap:8px;margin-bottom:6px}
.add-item input{flex:1;height:46px;border-radius:12px;border:0;background:var(--card);box-shadow:var(--shadow);padding:0 14px;outline:none}
.add-item button{width:46px;height:46px;border-radius:12px;background:var(--accent);color:var(--accent-ink);font-size:26px;font-weight:500}
.progress{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin:4px 0 6px}
.progress i{display:block;height:100%;background:var(--accent);border-radius:3px;transition:width .3s}
.aisle{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden;margin-bottom:12px}
.aisle h3{font-size:14px;font-weight:700;padding:12px 16px 4px;display:flex;justify-content:space-between}
.aisle h3 span{color:var(--muted);font-weight:600}
.gi{display:flex;align-items:center;gap:12px;padding:10px 16px;width:100%;text-align:left;position:relative}
.gi+.gi::before{content:"";position:absolute;top:0;left:58px;right:0;border-top:1px solid var(--line)}
.gi .check{width:26px;height:26px}
.gi .txt{flex:1;min-width:0}
.gi .q{font-weight:700}
.gi .for{display:block;font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gi.done .txt{color:var(--muted);text-decoration:line-through}
.gi .x{width:30px;height:30px;color:var(--muted);font-size:20px;flex:none}
.collapse-h{display:flex;align-items:center;justify-content:space-between;width:100%;padding:12px 16px}
.collapse-h b{font-size:14px}

/* ---------- sheets ---------- */
.sheet{position:fixed;inset:0;z-index:50;background:var(--bg);overflow-y:auto;-webkit-overflow-scrolling:touch;animation:up .28s cubic-bezier(.2,.8,.2,1)}
@keyframes up{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
.sheet-top{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:8px;padding:calc(var(--safe-t) + 8px) 12px 8px;
  background:color-mix(in srgb,var(--bg) 85%,transparent);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px)}
.sheet-top .title{font-weight:700;font-size:17px;flex:1;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.back{display:flex;align-items:center;gap:2px;color:var(--accent);font-weight:600;height:38px;padding-right:8px}
.back svg{width:22px;height:22px}
.sheet .pad{padding:0 16px calc(110px + var(--safe-b))}
.hero{height:200px;border-radius:20px;display:grid;place-items:center;font-size:100px;background:color-mix(in srgb,var(--c) 35%,var(--card));margin:4px 0 16px}
.rtitle{font-size:26px;letter-spacing:-.015em;line-height:1.15;margin-bottom:8px}
.metarow{display:flex;flex-wrap:wrap;gap:6px 14px;color:var(--muted);font-size:14px;font-weight:550;margin-bottom:10px}
.pill{display:inline-block;font-size:12px;font-weight:650;padding:4px 10px;border-radius:12px;background:var(--accent-soft);color:var(--accent);margin:0 6px 6px 0}
.pill.warn{background:color-mix(in srgb,var(--danger) 14%,var(--card));color:var(--danger)}
.ing{list-style:none;margin:8px 0 0;padding:0}
.ing li{display:flex;gap:12px;padding:10px 0;border-top:1px solid var(--line)}
.ing li:first-child{border-top:0}
.ing .q{min-width:76px;font-weight:700}
.steps{list-style:none;margin:8px 0 0;padding:0;counter-reset:s}
.steps li{display:flex;gap:12px;padding:12px 0;border-top:1px solid var(--line);counter-increment:s}
.steps li:first-child{border-top:0}
.steps li::before{content:counter(s);flex:none;width:26px;height:26px;border-radius:50%;background:var(--accent-soft);color:var(--accent);font-weight:700;font-size:13px;display:grid;place-items:center}
.steps .tm{display:inline-block;margin-top:6px;font-size:13px;font-weight:650;color:var(--accent)}
.sheet-foot{position:fixed;left:0;right:0;bottom:0;z-index:6;display:flex;gap:10px;padding:12px 16px calc(12px + var(--safe-b));
  background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-top:1px solid var(--line)}

/* action sheet */
.scrim{position:fixed;inset:0;z-index:150;background:rgba(0,0,0,.35);display:flex;align-items:flex-end;animation:fade .2s}
@keyframes fade{from{opacity:0}}
.actions{width:100%;padding:8px 10px calc(10px + var(--safe-b));animation:up .25s}
.actions .grp{background:var(--card);border-radius:14px;overflow:hidden;margin-bottom:8px}
.actions .grp p{text-align:center;color:var(--muted);font-size:13px;padding:12px 16px}
.actions button{display:block;width:100%;height:56px;font-size:18px;color:var(--accent);border-top:1px solid var(--line)}
.actions .grp>button:first-child{border-top:0}
.actions button.danger{color:var(--danger)}
.actions button.cancel{font-weight:700}

/* cook mode */
.cook{display:flex;flex-direction:column;min-height:100%}
.cook .bars{display:flex;gap:4px;padding:0 16px 8px}
.cook .bars i{flex:1;height:4px;border-radius:2px;background:var(--line)}
.cook .bars i.on{background:var(--accent)}
.cook-body{flex:1;padding:18px 22px 140px}
.cook .stepn{font-size:14px;font-weight:700;color:var(--accent);text-transform:uppercase;letter-spacing:.06em;margin-bottom:10px}
.cook .stept{font-size:25px;line-height:1.38;font-weight:550;letter-spacing:-.01em}
.timer{margin-top:26px;background:var(--card);box-shadow:var(--shadow);border-radius:20px;padding:16px;display:flex;align-items:center;gap:14px}
.timer .clock{font-size:36px;font-weight:700;font-variant-numeric:tabular-nums;flex:1}
.timer.run .clock{color:var(--accent)}
.timer.done{animation:pulse 1s infinite}
@keyframes pulse{50%{background:var(--accent-soft)}}
.timer button.tb{height:44px;padding:0 18px;border-radius:12px;background:var(--accent);color:var(--accent-ink);font-weight:700}
.timer button.tr{height:44px;padding:0 12px;color:var(--muted);font-weight:600}
.running{display:flex;flex-wrap:wrap;gap:8px;margin-top:22px}
.running button{font-size:13px;font-weight:650;padding:7px 12px;border-radius:16px;background:var(--accent-soft);color:var(--accent)}
.cook .ingpanel{margin-top:22px}
.mise li{cursor:pointer}
.mise li.got{color:var(--muted);text-decoration:line-through}

/* onboarding */
.ob{position:fixed;inset:0;z-index:100;background:var(--bg);overflow-y:auto;display:flex;flex-direction:column;padding:calc(var(--safe-t) + 28px) 20px calc(var(--safe-b) + 20px)}
.ob h1{font-size:30px;letter-spacing:-.02em;line-height:1.15;margin-bottom:10px}
.ob .lead{color:var(--muted);font-size:17px;margin-bottom:24px}
.ob .body{flex:1}
.ob .dots{display:flex;gap:6px;justify-content:center;margin-bottom:14px}
.ob .dots i{width:7px;height:7px;border-radius:50%;background:var(--line)}
.ob .dots i.on{background:var(--accent);width:20px;border-radius:4px}
.opt{display:flex;align-items:center;gap:14px;width:100%;text-align:left;background:var(--card);border:2px solid transparent;box-shadow:var(--shadow);border-radius:14px;padding:13px 14px;margin-bottom:10px}
.opt.on{border-color:var(--accent)}
.opt .em{font-size:26px;width:34px;text-align:center}
.opt b{display:block}
.opt small{color:var(--muted);font-size:13px}
.opt .radio{margin-left:auto;width:22px;height:22px;border-radius:50%;border:2px solid var(--line);flex:none}
.opt.on .radio{border:7px solid var(--accent)}
.welcome-art{font-size:84px;text-align:center;margin:40px 0 24px}

/* settings */
.set-row{display:flex;align-items:center;gap:12px;padding:14px 16px;width:100%;text-align:left;border-top:1px solid var(--line)}
.set-row:first-child{border-top:0}
.set-row .v{color:var(--muted);font-size:15px}
.set-group{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden}
.switch{width:51px;height:31px;border-radius:16px;background:var(--line);position:relative;flex:none;transition:.2s}
.switch::after{content:"";position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;background:#fff;box-shadow:0 2px 4px rgba(0,0,0,.2);transition:.2s}
.switch.on{background:var(--accent)}
.switch.on::after{left:22px}
.chev{color:var(--muted);width:18px;height:18px}
.tagin{display:flex;gap:8px;margin-top:10px}
.tagin input{flex:1}
.emoji-pick{display:flex;flex-wrap:wrap;gap:6px}
.emoji-pick button{width:42px;height:42px;border-radius:10px;font-size:24px;background:var(--card);border:2px solid transparent}
.emoji-pick button.on{border-color:var(--accent)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.help li{margin-bottom:8px}
</style>
</head>
<body>
<div id="main"></div>
<nav class="tabbar" id="tabbar">
  <button data-act="tab" data-tab="plan"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4.5" width="18" height="16.5" rx="3"/><path d="M3 9.5h18M8 2.5v4M16 2.5v4"/></svg>Meal Plan</button>
  <button data-act="tab" data-tab="recipes"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5V5a2 2 0 0 1 2-2h13v15H6a2 2 0 0 0-2 2 1.5 1.5 0 0 0 1.5 1.5H19"/><path d="M9 7h6"/></svg>Recipes</button>
  <button data-act="tab" data-tab="grocery"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 4h2.2l2.3 11.2a1.8 1.8 0 0 0 1.8 1.4h8.4a1.8 1.8 0 0 0 1.8-1.4L21 8H6.3"/><circle cx="9.5" cy="20.5" r="1.3"/><circle cx="17.5" cy="20.5" r="1.3"/></svg>Groceries<span class="badge hidden" id="gbadge"></span></button>
  <button data-act="tab" data-tab="settings"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg>Settings</button>
</nav>
<div id="sheets"></div>
<div id="ob"></div>
<div id="overlay"></div>
<div class="toast" id="toast"></div>
<input type="file" id="importFile" accept="application/json,.json" class="hidden">

<script>
// Starter recipe library. Original recipes written for this app.
// Ingredient: I(qty, unit, name, aisle). Step: S(text, timerSeconds).
(function(){
const I=(q,u,n,a)=>({q,u,n,a});
const S=(t,timer)=>({t,timer:timer||0});
window.STARTER_RECIPES=[
{id:'s01',title:'Sheet-Pan Lemon Herb Chicken & Potatoes',emoji:'🍋',color:'#f7d774',time:40,serves:2,cat:'poultry',lowcarb:false,paleo:false,allergens:[],tags:['Sheet pan'],
ing:[I(1,'lb','boneless skinless chicken thighs','meat'),I(1,'lb','baby potatoes','produce'),I(1,'','lemon','produce'),I(3,'clove','garlic','produce'),I(2,'tbsp','olive oil','oil'),I(1,'tsp','dried oregano','spices'),I(0.5,'tsp','salt','spices'),I(0.25,'tsp','black pepper','spices'),I(2,'tbsp','fresh parsley','produce')],

  if(w===0&&best[0]===0)best=FRAC[1];
  return (w?String(w):'')+best[1];
}
function unitLabel(u,q){if(!u)return '';return (q>1.001&&COUNT_UNITS[u])?COUNT_UNITS[u]:u;}
function plural(name,q){

  else if(/leaf$/i.test(base))base=base.slice(0,-1)+'ves';
  else base+='s';
  return base+rest;
}
function ingParts(i,factor){

}
function isStaple(n){n=n.toLowerCase().replace(/\(.*?\)/g,'').replace(/,.*/,'').trim();return STAPLES.includes(n);}
function fmtClock(s){s=Math.max(0,Math.ceil(s));const h=Math.floor(s/3600),m=Math.floor(s%3600/60),x=s%60;return (h?h+':'+String(m).padStart(2,'0'):m)+':'+String(x).padStart(2,'0');}
function fmtDur(s){if(s>=3600){const h=Math.floor(s/3600),m=Math.round(s%3600/60);return h+' hr'+(m?' '+m+' min':'');}if(s>=60)return Math.round(s/60)+' min';return s+' sec';}

/* ---------- parsing pasted text ---------- */
const UNI={'¼':.25,'½':.5,'¾':.75,'⅓':1/3,'⅔':2/3,'⅛':.125,'⅜':.375,'⅝':.625,'⅞':.875};
const QTY_RE='(?:\\d+\\s+\\d+\\/\\d+|\\d+\\/\\d+|\\d*\\s*[¼½¾⅓⅔⅛⅜⅝⅞]|\\d+(?:\\.\\d+)?)';
function numOf(t){
  t=t.trim();let v=0;const u=t.match(/[¼½¾⅓⅔⅛⅜⅝⅞]/);
  if(u){v+=UNI[u[0]];t=t.replace(u[0],'').trim();}
  if(!t)return v;
  if(/\s/.test(t)){const p=t.split(/\s+/);return v+(+p[0]||0)+numOf(p.slice(1).join(' '));}
  if(t.includes('/')){const [a,b]=t.split('/');return v+((+a)/(+b)||0);}
  return v+(+t||0);
}
function parseIngredient(line){
  let s=line.trim().replace(/^[-•*▢☐□–]\s*/,'');
  let q=0,rest=s;
  const m=s.match(new RegExp('^('+QTY_RE+')(?:\\s*(?:-|–|to)\\s*'+QTY_RE+')?\\s*(.*)$'));
  if(m){q=numOf(m[1]);rest=m[2];}
  let u='',paren='';
  const pm=rest.match(/^(\([^)]*\))\s*(.*)$/);if(pm){paren=pm[1];rest=pm[2];}
  const wm=rest.match(/^([A-Za-z]+)\.?\s+(.*)$/);
  if(wm){const w=wm[1];const unit=w==='T'?'tbsp':w==='t'?'tsp':UNIT_SYN[w.toLowerCase()];
    if(unit&&(q||unit==='pinch'||unit==='dash')){if(!q)q=1;u=unit;rest=wm[2];}}
  rest=rest.replace(/^of\s+/i,'').trim();
  if(paren)rest=rest+' '+paren;
  const n=rest||s;
  return {q,u,n,a:guessAisle(n)};
}
function detectTimer(t){
  const m=t.match(/(\d+(?:\.\d+)?)(?:\s*(?:-|–|to)\s*(\d+(?:\.\d+)?))?\s*(hours?|hrs?|minutes?|mins?|seconds?|secs?)\b/i);
  if(!m)return 0;const v=+(m[2]||m[1]);const u=m[3].toLowerCase();
  return Math.round(v*(u.startsWith('h')?3600:u.startsWith('s')?1:60));
}
function parsePasted(text){
  const lines=text.split(/\r?\n/).map(l=>l.trim());
  let title='',ing=[],steps=[],mode=null,serves=0,time=0,loose=[];
  for(const l of lines){
    if(!l)continue;
    const low=l.toLowerCase().replace(/[:#*_]/g,'').trim();
    if(/^ingredients?\b/.test(low)&&low.length<30){mode='i';continue;}
    if(/^(instructions|directions|method|steps|preparation|how to make it)\b/.test(low)&&low.length<30){mode='s';continue;}
    if(/^(notes?|nutrition)\b/.test(low)&&low.length<20){mode='x';continue;}
    const sv=low.match(/^(?:serves|servings|yield|makes)\D{0,12}(\d+)/);if(sv){serves=+sv[1];continue;}
    const tm=low.match(/^(?:total|cook|prep)?\s*time\D{0,6}(\d+)\s*(h|hr|hour|m|min)/);if(tm){time=Math.max(time,+tm[1]*(tm[2].startsWith('h')?60:1));continue;}
    if(!title&&!mode){title=l.replace(/^#+\s*/,'');continue;}
    if(mode==='i')ing.push(l);
    else if(mode==='s')steps.push(l.replace(/^(step\s*)?\d+[.):]?\s+/i,''));
    else if(!mode)loose.push(l);
  }
  if(!ing.length&&!steps.length){
    for(const l of loose){if(new RegExp('^[-•*]?\\s*'+QTY_RE).test(l)&&l.length<80)ing.push(l);else steps.push(l.replace(/^(step\s*)?\d+[.):]?\s+/i,''));}
  }
  const st=steps.map(t=>({t,timer:detectTimer(t)}));
  if(!time)time=Math.max(15,Math.round(st.reduce((a,s)=>a+s.timer,0)/60)+10);
  return {title:title||'New recipe',ing:ing.map(parseIngredient),steps:st,serves:serves||4,time};
}

/* ================= state ================= */
function defaults(){return {v:1,prefs:{diet:'classic',allergies:[],dislikes:[],servings:2,onboarded:false,stapleSection:true},
  custom:[],hidden:[],favorites:[],plan:[],grocery:{checked:{},custom:[],removed:{},cleared:[]},lastBackup:null};}
let state=defaults();
try{const raw=localStorage.getItem(STORE_KEY);if(raw){const s=JSON.parse(raw);state=Object.assign(defaults(),s);state.prefs=Object.assign(defaults().prefs,s.prefs||{});state.grocery=Object.assign(defaults().grocery,s.grocery||{});}}catch(e){}
function save(){try{localStorage.setItem(STORE_KEY,JSON.stringify(state));}catch(e){toast('Could not save — storage is full or blocked');}}
try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist();}catch(e){}

const ui={tab:'plan',filter:'all',q:'',showAll:false,obStep:0,stapleOpen:false,cookIng:false};

function allRecipes(){return [...STARTER_RECIPES.filter(r=>!state.hidden.includes(r.id)),...state.custom];}
function getRecipe(id){return state.custom.find(r=>r.id===id)||STARTER_RECIPES.find(r=>r.id===id);}
function fits(r,p=state.prefs){
  if(!(DIET_OK[p.diet]||DIET_OK.classic)(r))return false;
  if((r.allergens||[]).some(a=>p.allergies.includes(a)))return false;
  if(p.dislikes.length){const hay=(r.title+'|'+r.ing.map(i=>i.n).join('|')).toLowerCase();if(p.dislikes.some(d=>d&&hay.includes(d.toLowerCase())))return false;}
  return true;
}
const inPlan=id=>state.plan.find(e=>e.id===id);
const isFav=id=>state.favorites.includes(id);

/* ================= mutations ================= */
function addToPlan(id,servings){if(inPlan(id))return;state.grocery.cleared=(state.grocery.cleared||[]).filter(x=>x!==id);state.plan.push({id,servings:servings||state.prefs.servings,cooked:false});state.grocery.removed={};save();}
function removeFromPlan(id){state.plan=state.plan.filter(e=>e.id!==id);state.grocery.cleared=(state.grocery.cleared||[]).filter(x=>x!==id);state.grocery.removed={};save();}
function togglePlan(id,servings){if(inPlan(id)){removeFromPlan(id);toast('Removed from plan');}else{addToPlan(id,servings);toast('Added to your meal plan');}refresh();}
function toggleFav(id){const i=state.favorites.indexOf(id);if(i>=0)state.favorites.splice(i,1);else state.favorites.push(id);save();refresh();}
function suggest(n=3){
  const pool=shuffle(allRecipes().filter(r=>fits(r)&&!inPlan(r.id)));
  const pick=pool.slice(0,n);pick.forEach(r=>addToPlan(r.id));
  toast(pick.length?`Added ${pick.length} recipe${pick.length>1?'s':''} to your plan`:'No more recipes match your preferences');refresh();
}

/* ================= grocery ================= */
function groceryItems(){
  const map=new Map();
  for(const e of state.plan){
    if((state.grocery.cleared||[]).includes(e.id))continue;
    const r=getRecipe(e.id);if(!r)continue;const f=e.servings/r.serves;
    for(const i of r.ing){
      const U=UNIT[i.u];const fam=U?U.f:(i.u||'ct');
      const key='p:'+i.n.trim().toLowerCase()+'|'+fam;
      let it=map.get(key);
      if(!it){it={key,name:i.n,aisle:i.a||guessAisle(i.n),fam,unit:i.u,total:0,recipes:[],staple:isStaple(i.n)};map.set(key,it);}
      if(i.q)it.total+=U?i.q*f*U.b:i.q*f;
      if(!it.recipes.includes(r.title))it.recipes.push(r.title);
    }
  }
  const out=[...map.values()].filter(it=>!state.grocery.removed[it.key]);
  for(const c of state.grocery.custom)out.push({key:'c:'+c.id,name:c.name,aisle:c.aisle,total:0,recipes:[],custom:true,staple:false,fam:'ct',unit:''});
  return out;
}
function groceryLabel(it){
  if(!it.total)return {q:'',n:it.name};
  let q=it.total,u=it.unit;
  if(it.fam==='vol'){if(q>=12){u='cup';q/=48;}else if(q>=3){u='tbsp';q/=3;}else u='tsp';}
  else if(it.fam==='wt'){if(q>=16){u='lb';q/=16;}else u='oz';}
  else if(it.fam==='g'){if(q>=1000){u='kg';q/=1000;}else u='g';}
  else if(it.fam==='ml'){if(q>=1000){u='l';q/=1000;}else u='ml';}
  else u=it.unit||'';
  return {q:(fmtQty(q)+' '+unitLabel(u,q)).trim(),n:u?it.name:plural(it.name,q)};
}
function groceryCounts(){
  const items=groceryItems().filter(it=>!(state.prefs.stapleSection&&it.staple));
  const done=items.filter(it=>state.grocery.checked[it.key]).length;
  return {total:items.length,done,left:items.length-done};
}
function clearGroceryPrompt(){
  const n=groceryItems().length;
  confirmSheet(`Clear the entire grocery list? All ${n} item${n===1?'':'s'} will be removed, including ones you added yourself. Your meal plan won't change.`,'Clear list',()=>{
    state.grocery.cleared=state.plan.map(e=>e.id);state.grocery.custom=[];state.grocery.checked={};state.grocery.removed={};
    save();refresh();toast('Grocery list cleared');
  });
}
function groceryText(){
  const items=groceryItems();let out='Grocery list\n';
  for(const [a,name] of AISLES){
    const list=items.filter(it=>it.aisle===a&&!state.grocery.checked[it.key]&&!(state.prefs.stapleSection&&it.staple));
    if(!list.length)continue;out+='\n'+name.toUpperCase()+'\n';
    for(const it of list){const l=groceryLabel(it);out+='• '+(l.q?l.q+' ':'')+l.n+'\n';}
  }
  return out.trim();
}

    list.sort((x,y)=>(!!g.checked[x.key])-(!!g.checked[y.key])||x.name.localeCompare(y.name));
    h+=`<div class="aisle"><h3>${name}<span>${left?left+' left':'✓'}</span></h3>${list.map(row).join('')}</div>`;
  }
  if(staples.length){
    h+=`<div class="aisle"><button class="collapse-h" data-act="staples"><span><b>You probably have these</b><br><span class="muted small">${staples.length} pantry staple${staples.length>1?'s':''} — tap to ${ui.stapleOpen?'hide':'review'}</span></span>${ui.stapleOpen?'▲':'▼'}</button>${ui.stapleOpen?staples.map(row).join(''):''}</div>`;
  }
  h+=`<button class="btn danger" style="margin-top:8px" data-act="clear-list">Clear entire list</button>`;
  return h;
}

/* ================= timers ================= */
const timers={};let tickH=null,audio=null;
const timerKey=(id,i)=>id+':'+i;
function timerLeft(t){return t.running?Math.max(0,(t.end-Date.now())/1000):t.left;}
function timerHTML(key,label,total){
  const t=timers[key];const left=t?timerLeft(t):total;const run=t&&t.running;const done=t&&t.done;
  return `<div class="timer ${run?'run':''} ${done?'done':''}" data-timer-box="${key}"><span class="clock" data-timer-text="${key}">${done?'Done!':fmtClock(left)}</span>
    ${t&&!done&&left<total?`<button class="tr" data-act="t-reset" data-key="${key}">Reset</button>`:''}
    ${done?`<button class="tb" data-act="t-reset" data-key="${key}">OK</button>`:`<button class="tb" data-act="${run?'t-pause':'t-start'}" data-key="${key}" data-label="${esc(label)}" data-total="${total}">${run?'Pause':(t&&left<total?'Resume':'Start')}</button>`}</div>`;
}
function ensureAudio(){try{if(!audio)audio=new (window.AudioContext||window.webkitAudioContext)();if(audio.state==='suspended')audio.resume();}catch(e){}}
function beep(){try{ensureAudio();if(!audio)return;const t0=audio.currentTime;for(let k=0;k<4;k++){const o=audio.createOscillator(),g=audio.createGain();o.type='sine';o.frequency.value=880;o.connect(g);g.connect(audio.destination);const s=t0+k*0.35;g.gain.setValueAtTime(0.0001,s);g.gain.exponentialRampToValueAtTime(0.4,s+0.02);g.gain.exponentialRampToValueAtTime(0.0001,s+0.25);o.start(s);o.stop(s+0.3);}}catch(e){}if(navigator.vibrate)navigator.vibrate([300,150,300]);}
function startTimer(key,label,total){ensureAudio();let t=timers[key];if(!t||t.done){t=timers[key]={label,total,left:total,running:false,done:false};}t.running=true;t.end=Date.now()+t.left*1000;if(!tickH)tickH=setInterval(tick,250);renderSheets();}
function pauseTimer(key){const t=timers[key];if(!t)return;t.left=timerLeft(t);t.running=false;renderSheets();}
function resetTimer(key){delete timers[key];renderSheets();}
function tick(){
  let any=false;
  for(const [k,t] of Object.entries(timers)){
    if(!t.running)continue;any=true;const left=timerLeft(t);
    document.querySelectorAll(`[data-timer-text="${k}"]`).forEach(el=>el.textContent=fmtClock(left));
    if(left<=0){t.running=false;t.left=0;t.done=true;beep();toast('⏰ '+t.label+' timer is done');renderSheets();}
  }
  if(!any){clearInterval(tickH);tickH=null;}
}
document.addEventListener('visibilitychange',()=>{if(!document.hidden){tick();if(topSheet()&&topSheet().type==='cook')requestWake();}});

let wake=null;
async function requestWake(){try{if('wakeLock' in navigator&&!wake){wake=await navigator.wakeLock.request('screen');wake.addEventListener('release',()=>{wake=null;});}}catch(e){wake=null;}}
function releaseWake(){try{if(wake)wake.release();}catch(e){}wake=null;}

function readForm(s){
  const f=$('#recipeForm');if(!f)return;const fd=new FormData(f);const d=s.draft;
  d.title=(fd.get('title')||'').trim();d.time=Math.max(1,parseInt(fd.get('time'))||30);d.serves=Math.max(1,parseInt(fd.get('serves'))||2);d.cat=fd.get('cat');
  d.notes=(fd.get('notes')||'').trim();d.source=(fd.get('source')||'').trim();
  d._ingText=fd.get('ing');d._stepText=fd.get('steps');
  d.ing=String(fd.get('ing')||'').split('\n').map(l=>l.trim()).filter(Boolean).map(parseIngredient);
  d.steps=String(fd.get('steps')||'').split('\n').map(l=>l.trim()).filter(Boolean).map(t=>{t=t.replace(/^(step\s*)?\d+[.):]\s+/i,'');return {t,timer:detectTimer(t)};});
}
function saveRecipe(){
  const s=topSheet();readForm(s);const d=s.draft;
  if(!d.title){toast('Give your recipe a name');return;}
  if(!d.ing.length){toast('Add at least one ingredient');return;}
  const rec={id:s.id||'c'+uid(),custom:true,title:d.title,emoji:d.emoji,color:d.color,time:d.time,serves:d.serves,cat:d.cat,lowcarb:d.lowcarb,paleo:d.paleo,allergens:d.allergens,tags:d.tags||[],ing:d.ing,steps:d.steps,notes:d.notes,source:d.source};
  const idx=state.custom.findIndex(r=>r.id===rec.id);
  if(idx>=0)state.custom[idx]=rec;else state.custom.push(rec);
  if(s.replaces){
    if(!state.hidden.includes(s.replaces))state.hidden.push(s.replaces);
    state.plan.forEach(e=>{if(e.id===s.replaces)e.id=rec.id;});
    state.favorites=state.favorites.map(f=>f===s.replaces?rec.id:f);
  }
  save();
  sheets[sheets.length-1]={type:'recipe',id:rec.id,servings:state.prefs.servings};
  // drop any recipe sheet underneath that pointed at the old version
  sheets=sheets.filter((x,i)=>i===sheets.length-1||!(x.type==='recipe'&&(x.id===rec.id||x.id===s.replaces)));
  toast('Recipe saved');refresh();
}
function editRecipe(id){
  const r=getRecipe(id);if(!r)return;
  const d=Object.assign(blankDraft(),clone(r));
  if(r.custom)openSheet({type:'edit',id:r.id,draft:d});
  else openSheet({type:'edit',id:null,replaces:r.id,draft:d});
}

/* ================= backup ================= */
async function exportBackup(){
  const data=JSON.stringify({app:'supper',exported:new Date().toISOString(),state},null,2);
  const name='supper-backup-'+new Date().toISOString().slice(0,10)+'.json';
  try{
    const file=new File([data],name,{type:'application/json'});
    if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],title:'Supper backup'});state.lastBackup=Date.now();save();refresh();return;}
  }catch(e){if(e&&e.name==='AbortError')return;}
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([data],{type:'application/json'}));a.download=name;document.body.appendChild(a);a.click();
  setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},1000);
  state.lastBackup=Date.now();save();refresh();
}
$('#importFile').addEventListener('change',e=>{
  const f=e.target.files[0];if(!f)return;const rd=new FileReader();
  rd.onload=()=>{try{const o=JSON.parse(rd.result);const s=o.state||o;if(!s.prefs||!Array.isArray(s.plan))throw 0;
    confirmSheet('Replace everything on this device with the backup from '+(o.exported?new Date(o.exported).toLocaleDateString():'this file')+'?','Restore backup',()=>{
      state=Object.assign(defaults(),s);state.prefs=Object.assign(defaults().prefs,s.prefs);state.grocery=Object.assign(defaults().grocery,s.grocery||{});save();refresh();renderOb();toast('Backup restored');});
  }catch(err){toast("That file isn't a Supper backup");}e.target.value='';};
  rd.readAsText(f);
});

/* ================= events ================= */
document.addEventListener('click',async e=>{
  const el=e.target.closest('[data-act]');
  if(!el){return;}
  const act=el.dataset.act;const id=el.dataset.id;
  if(act!=='dismiss'&&act!=='action'&&e.target.closest('[data-stop]')&&!el.closest('[data-stop]')){/* inner */}
  switch(act){
    case 'tab':ui.tab=el.dataset.tab;while(sheets.length){sheets.pop();}renderSheets();window.scrollTo(0,0);renderMain();updateBadge();break;
    case 'suggest':suggest(3);break;
    case 'plan-menu':actionSheet('',[{label:'Suggest 3 more meals',fn:()=>suggest(3)},{label:'Mark all as not cooked',fn:()=>{state.plan.forEach(p=>p.cooked=false);save();refresh();}},{label:'Remove cooked meals',fn:()=>{state.plan=state.plan.filter(p=>!p.cooked);state.grocery.removed={};save();refresh();}},{label:'Clear meal plan & list',danger:true,fn:()=>{state.plan=[];state.grocery={checked:{},custom:[],removed:{},cleared:[]};save();refresh();toast('Plan cleared');}}]);break;
    case 'plan-serv':{e.stopPropagation();const p=inPlan(id);if(!p)break;p.servings=Math.min(20,Math.max(1,p.servings+ +el.dataset.d));save();refresh();break;}
    case 'cooked':{e.stopPropagation();const p=inPlan(id);if(!p)break;p.cooked=!p.cooked;save();refresh();if(p.cooked)toast('Nice! Marked as cooked');break;}
    case 'open-recipe':if(e.target.closest('.stepper')||e.target.closest('.check'))break;openSheet({type:'recipe',id,servings:state.prefs.servings});break;
    case 'toggle-plan':e.stopPropagation();togglePlan(id,+el.dataset.serv||undefined);break;
    case 'filter':ui.filter=el.dataset.f;renderMain();break;
    case 'show-all':ui.showAll=!ui.showAll;$('#rgrid').innerHTML=recipeGrid();break;
    case 'add-menu':actionSheet('Add a recipe',[{label:'Paste from a website',fn:()=>openSheet({type:'paste'})},{label:'Type it in',fn:()=>openSheet({type:'edit',id:null,draft:blankDraft()})}]);break;
    case 'new-recipe':openSheet({type:'edit',id:null,draft:blankDraft()});break;
    case 'paste':openSheet({type:'paste'});break;
    case 'parse-paste':{const t=$('#pasteBox').value.trim();if(!t){toast('Paste a recipe first');break;}const p=parsePasted(t);const d=Object.assign(blankDraft(),p);
      const hay=(p.title+' '+p.ing.map(i=>i.n).join(' ')).toLowerCase();
      d.cat=/shrimp|salmon|fish|cod|tuna|scallop/.test(hay)?'fish':/beef|steak|lamb/.test(hay)?'red':/pork|bacon|sausage|ham\b/.test(hay)?'pork':/chicken|turkey/.test(hay)?'poultry':'vegetarian';
      const al=[];if(/flour|bread|pasta|noodle|spaghetti|tortilla|soy sauce|linguine|penne/.test(hay))al.push('gluten');if(/milk|cream|butter|cheese|yogurt|parmesan/.test(hay))al.push('dairy');if(/\begg/.test(hay))al.push('egg');if(/soy/.test(hay))al.push('soy');if(/peanut/.test(hay))al.push('peanut');if(/almond|walnut|pecan|cashew|pistachio/.test(hay))al.push('treenut');if(/shrimp|crab|lobster|scallop/.test(hay))al.push('shellfish');if(/salmon|cod|tuna|fish/.test(hay))al.push('fish');if(/sesame|tahini/.test(hay))al.push('sesame');d.allergens=al;
      sheets[sheets.length-1]={type:'edit',id:null,draft:d};renderSheets();toast('Check the details, then save');break;}
    case 'close':closeSheet();break;
    case 'fav':toggleFav(id);break;
    case 'recipe-menu':{const r=getRecipe(id);const items=[{label:r.custom?'Edit recipe':'Edit (saves your own copy)',fn:()=>editRecipe(id)},{label:'Share recipe',fn:()=>shareRecipe(r)}];
      if(r.custom)items.push({label:'Delete recipe',danger:true,fn:()=>confirmSheet('Delete "'+r.title+'"? This can\'t be undone.','Delete recipe',()=>{state.custom=state.custom.filter(x=>x.id!==id);removeFromPlan(id);state.favorites=state.favorites.filter(f=>f!==id);save();closeSheet();toast('Recipe deleted');})});
      else items.push({label:'Hide this recipe',danger:true,fn:()=>{state.hidden.push(id);removeFromPlan(id);save();closeSheet();toast('Hidden. Restore it from Settings.');}});
      actionSheet(r.title,items);break;}
    case 'r-serv':{const s=topSheet();const p=inPlan(s.id);if(p){p.servings=Math.min(20,Math.max(1,p.servings+ +el.dataset.d));save();}else s.servings=Math.min(20,Math.max(1,s.servings+ +el.dataset.d));refresh();break;}
    case 'cook':{const s=topSheet();openSheet({type:'cook',id,step:0,servings:s.servings,got:{}});requestWake();break;}
    case 'step':{const s=topSheet();const r=getRecipe(s.id);s.step=Math.min(r.steps.length,Math.max(0,s.step+ +el.dataset.d));renderSheets();$('#sheets').lastElementChild.scrollTop=0;break;}
    case 'goto-step':{const s=topSheet();s.step=+el.dataset.step;renderSheets();break;}
    case 'cook-ing':ui.cookIng=!ui.cookIng;renderSheets();break;
    case 'got':{const s=topSheet();s.got=s.got||{};s.got[el.dataset.j]=!s.got[el.dataset.j];renderSheets();break;}
    case 'finish':{const p=inPlan(id);if(p){p.cooked=true;save();}closeSheet();setTimeout(()=>toast('Marked as cooked 🎉'),50);break;}
    case 't-start':startTimer(el.dataset.key,el.dataset.label,+el.dataset.total);break;
    case 't-pause':pauseTimer(el.dataset.key);break;
    case 't-reset':resetTimer(el.dataset.key);break;
    case 'gcheck':{if(e.target.closest('.x'))break;const k=el.dataset.key;if(state.grocery.checked[k])delete state.grocery.checked[k];else state.grocery.checked[k]=true;save();renderMain();updateBadge();
      const c=groceryCounts();if(c.total&&c.left===0)toast('All done — happy cooking! 🎉');break;}
    case 'gremove':{e.stopPropagation();const k=el.dataset.key;if(k.startsWith('c:'))state.grocery.custom=state.grocery.custom.filter(c=>'c:'+c.id!==k);else state.grocery.removed[k]=true;delete state.grocery.checked[k];save();renderMain();updateBadge();break;}
    case 'staples':ui.stapleOpen=!ui.stapleOpen;renderMain();break;
    case 'grocery-menu':actionSheet('',[{label:'Share list',fn:shareList},{label:'Uncheck all items',fn:()=>{state.grocery.checked={};save();refresh();}},{label:'Clear checked items',fn:()=>{const items=groceryItems();for(const it of items){if(state.grocery.checked[it.key]){if(it.custom)state.grocery.custom=state.grocery.custom.filter(c=>'c:'+c.id!==it.key);else state.grocery.removed[it.key]=true;delete state.grocery.checked[it.key];}}save();refresh();}},{label:'Restore removed items',fn:()=>{state.grocery.removed={};state.grocery.cleared=[];save();refresh();}},{label:'Clear entire list',danger:true,fn:clearGroceryPrompt}]);break;
    case 'clear-list':clearGroceryPrompt();break;
    case 'pick-diet':openSheet({type:'diet'});break;
    case 'set-diet':state.prefs.diet=el.dataset.k;save();if(state.prefs.onboarded)refresh();else renderOb();break;
    case 'allergy':{const k=el.dataset.k;const a=state.prefs.allergies;const i=a.indexOf(k);if(i>=0)a.splice(i,1);else a.push(k);save();if(state.prefs.onboarded)refresh();else renderOb();break;}
    case 'undislike':state.prefs.dislikes=state.prefs.dislikes.filter(d=>d!==el.dataset.k);save();refresh();break;
    case 'def-serv':state.prefs.servings=Math.min(12,Math.max(1,state.prefs.servings+ +el.dataset.d));save();refresh();break;
    case 'toggle-staples':state.prefs.stapleSection=!state.prefs.stapleSection;save();refresh();break;
    case 'unhide':state.hidden=[];save();refresh();toast('Hidden recipes restored');break;
    case 'export':exportBackup();break;
    case 'import':$('#importFile').click();break;
    case 'reset':confirmSheet('Erase all recipes, plans, lists and settings on this device?','Erase everything',()=>{state=defaults();save();ui.obStep=0;ui.tab='plan';refresh();renderOb();});break;
    case 'pick-emoji':{const s=topSheet();readForm(s);s.draft.emoji=el.dataset.e;renderSheets();break;}
    case 'edit-allergen':{const s=topSheet();readForm(s);const a=s.draft.allergens;const k=el.dataset.k;const i=a.indexOf(k);if(i>=0)a.splice(i,1);else a.push(k);renderSheets();break;}
    case 'edit-flag':{const s=topSheet();readForm(s);s.draft[el.dataset.k]=!s.draft[el.dataset.k];renderSheets();break;}
    case 'save-recipe':saveRecipe();break;
    case 'ob-next':if(ui.obStep<3){ui.obStep++;renderOb();}else{state.prefs.onboarded=true;save();renderOb();refresh();}break;
    case 'ob-back':ui.obStep=Math.max(0,ui.obStep-1);renderOb();break;
    case 'ob-serv':state.prefs.servings=+el.dataset.n;save();renderOb();break;
    case 'dismiss':if(e.target.closest('[data-stop]')&&!el.classList.contains('cancel'))break;$('#overlay').innerHTML='';break;
    case 'action':{const fn=actionHandlers[+el.dataset.i];$('#overlay').innerHTML='';if(fn)setTimeout(fn,0);break;}
  }
});
document.addEventListener('submit',e=>{
  const f=e.target.dataset.form;if(!f)return;e.preventDefault();
  if(f==='add-item'){const inp=$('#newItem');const v=inp.value.trim();if(!v)return;state.grocery.custom.push({id:uid(),name:v,aisle:guessAisle(v)});save();renderMain();updateBadge();$('#newItem').focus();}
  if(f==='dislike'){const inp=$('#dislikeIn');const vals=inp.value.split(',').map(x=>x.trim().toLowerCase()).filter(Boolean);for(const v of vals)if(!state.prefs.dislikes.includes(v))state.prefs.dislikes.push(v);save();refresh();}
  if(f==='recipe')saveRecipe();
});
document.addEventListener('input',e=>{
  if(e.target.id==='q'){ui.q=e.target.value;$('#rgrid').innerHTML=recipeGrid();}
});

async function shareList(){
  const text=groceryText();
  try{if(navigator.share){await navigator.share({title:'Grocery list',text});return;}}catch(e){if(e&&e.name==='AbortError')return;}
  try{await navigator.clipboard.writeText(text);toast('List copied to clipboard');}catch(e){toast('Sharing is not available here');}
}
async function shareRecipe(r){
  const text=r.title+'\n'+r.time+' min · serves '+r.serves+'\n\nINGREDIENTS\n'+r.ing.map(i=>{const x=ingParts(i,1);return '• '+(x.q?x.q+' ':'')+x.n;}).join('\n')+'\n\nSTEPS\n'+r.steps.map((s,i)=>(i+1)+'. '+s.t).join('\n');
  try{if(navigator.share){await navigator.share({title:r.title,text});return;}}catch(e){if(e&&e.name==='AbortError')return;}
  try{await navigator.clipboard.writeText(text);toast('Recipe copied to clipboard');}catch(e){toast('Sharing is not available here');}
}

/* ================= boot ================= */
refresh();renderOb();
if('serviceWorker' in navigator&&location.protocol.startsWith('http')){window.addEventListener('load',()=>{navigator.serviceWorker.register('sw.js').catch(()=>{});});}
</script>
